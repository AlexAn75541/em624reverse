[package]
name = "em624-driver"
version = "0.1.0"
edition = "2021"
authors = ["Aretzera"]
license = "MIT"
description = "Cross-platform driver & configuration GUI/CLI for E-DRA EM624 gaming mouse (SunplusIT SPCP6662 / 6662IC)"

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
libudev-sys = "0.1"

[[bin]]
name = "em624"
path = "src/main.rs"
